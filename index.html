<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#16161a;--line:#2a2a31;--text:#f4f4f2;--dim:#8d8d96;--accent:#ff3d4a;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Saira Condensed","Saira Condensed Local","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;min-height:100vh;background-image:radial-gradient(circle at 80% -10%,#2a0f14 0,transparent 45%)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.logo{background:var(--accent);color:#fff;font-weight:800;padding:2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);font-size:20px}
h1{margin:0;font-size:22px;font-weight:700}
.mode{margin-left:auto;color:var(--dim);font-size:15px}
.hero{position:relative;height:300px;overflow:hidden;border:1px solid var(--line)}
.art{position:absolute;inset:0}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.1) 70%),linear-gradient(0deg,rgba(0,0,0,.7),transparent 50%)}
.hero .txt{position:absolute;left:24px;bottom:20px}
.lbl{font-size:16px;color:var(--gold);font-weight:700}
.big{font-size:clamp(40px,9vw,84px);font-weight:800;line-height:.95;margin:2px 0 0}
.next{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.next .t{font-size:clamp(20px,4.2vw,32px);font-weight:800}
.next .t b{color:var(--gold)}
.cd{margin-left:auto;font-size:clamp(26px,5.5vw,40px);font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);margin-top:10px;flex-basis:100%}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.chip{position:relative;height:84px;overflow:hidden;border:1px solid var(--line);opacity:.55}
.next .t,.cd,.chip .n,.chip .k,.mode{font-family:"Saira","Saira Local","Arial Narrow",sans-serif}
.chip .n{position:absolute;left:8px;bottom:6px;font-weight:700;font-size:17px;line-height:1.05}
.chip .k{position:absolute;right:8px;top:6px;font-size:13px;font-weight:700;color:var(--gold)}
.chip::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent 65%)}
.chip .n,.chip .k{z-index:1;text-shadow:0 1px 3px #000}
.chip.cur{opacity:1;border-color:var(--accent)}
.chip.nxt{opacity:.85;border-color:var(--gold)}
</style>
</head>

<div class="wrap">
  <header><span class="logo">THE FINALS</span><h1>Point Break</h1><span class="mode">Map rotation</span></header>

  <div class="next"><div class="t">Next map: <b id="nxt">--</b>, in: <b id="mins">--</b></div><div class="cd" id="cd">--:--</div><div class="bar"><i id="fill"></i></div></div>

const MAPS = [
  {n:"Monaco", a:"#2fa6ff", b:"#071a2e"},
  {n:"Starlight Hollow", a:"#6b5bff", b:"#0b0a2e"},
  {n:"SYS$HORIZON", a:"#2fffc4", b:"#062a22"},
  {n:"NOZOMI/CITADEL", a:"#ff4f7b", b:"#2a0a16"},
  {n:"Bernal", a:"#d9693f", b:"#2a1209"},
  {n:"Las Vegas Stadium", a:"#c23cff", b:"#150a2a"}
];
// Best fit: 6 min per map (sightings were taken at queue time, about 1.75 min before the match). Monaco live about 12:49:15 Tunisia time (UTC+1) = 11:49:15 UTC.
const DEFAULT = { anchor: Date.UTC(2026,10,26,11,49,15), idx: 0, min: 6 };
const S = DEFAULT;
const $ = id => document.getElementById(id);

function art(m){
  const d = document.createElement("div");
  d.style.cssText = "position:absolute;inset:0;background:radial-gradient(circle at 75% 25%,"+m.a+"aa,transparent 55%),linear-gradient(135deg,"+m.b+","+m.a+"55)";
  const w = document.createElement("div");
  w.textContent = m.n;
  w.style.cssText = "position:absolute;right:-6px;bottom:-10px;font-size:90px;font-weight:800;opacity:.12;white-space:nowrap";
  if (!IMAGES[m.n]) d.appendChild(w);
  const url = IMAGES[m.n];
  if (url) { const i = document.createElement("img"); i.src = url; i.alt = ""; i.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover"; i.onerror = () => i.remove(); d.appendChild(i); }
  return d;
}

let lastCur = -1;
function tick(){
  const ms = S.min * 60000, now = Date.now();
  const slot = Math.floor((now - S.anchor) / ms);
  const cur = (((S.idx + slot) % MAPS.length) + MAPS.length) % MAPS.length, nxt = (cur + 1) % MAPS.length;
  const rem = S.anchor + (slot + 1) * ms - now;
  const mins = Math.max(1, Math.ceil(rem / 60000));
  $("cur").textContent = MAPS[cur].n;
  $("nxt").textContent = MAPS[nxt].n;
  $("mins").textContent = mins + (mins === 1 ? " minute" : " minutes");
  const s = Math.ceil(rem / 1000);
  $("cd").textContent = String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0");
  $("fill").style.width = (100 - rem / ms * 100) + "%";
  if (cur !== lastCur) {
    lastCur = cur;
    $("heroArt").replaceChildren(art(MAPS[cur]));
    $("strip").replaceChildren(...MAPS.map((m,i) => {
      const c = document.createElement("div");
      c.className = "chip" + (i === cur ? " cur" : i === nxt ? " nxt" : "");
      c.appendChild(art(m));
      const n = document.createElement("div"); n.className = "n"; n.textContent = m.n; c.appendChild(n);
      if (i === cur || i === nxt) { const k = document.createElement("div"); k.className = "k"; k.textContent = i === cur ? "Now" : "Next"; c.appendChild(k); }
      return c;
    }));
  }
}
tick(); setInterval(tick, 500);
